services:
  app:
    build: .
    ports: ["8001:8000"]
    environment:
      PORT: 8000
      DATABASE_URL: postgresql+psycopg://supplier:supplier@db:5432/supplier
      SERPER_API_KEY: ${SERPER_API_KEY:-}
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supplier
      POSTGRES_USER: supplier
      POSTGRES_PASSWORD: supplier
    volumes: ["supplier_no_llm_data:/var/lib/postgresql/data"]
volumes:
  supplier_no_llm_data:
